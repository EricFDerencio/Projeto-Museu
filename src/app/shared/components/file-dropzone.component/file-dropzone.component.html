<section class="dropzone-shell">
  <h3>{{ title }}</h3>

  <button
    type="button"
    class="dropzone"
    [class.is-dragging]="isDragging"
    [class.is-compact]="compact"
    (click)="openPicker()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    @if (!compact) {
      <span class="icon" aria-hidden="true">
        @switch (mediaType) {
          @case ('video') {
            <svg viewBox="0 0 24 24">
              <path
                d="M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1.2L20 7v10l-5-2.2V16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Z"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
              />
            </svg>
          }
          @case ('audio') {
            <svg viewBox="0 0 24 24">
              <path
                d="M9 18V6l10-2v12M9 10l10-2M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm10 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
              />
            </svg>
          }
          @case ('image') {
            <svg viewBox="0 0 24 24">
              <path
                d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-13Z"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
              />
              <path
                d="m7 16 3-3 2.4 2.4L15.5 12 18 14.5M8.5 9.5h.01"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
              />
            </svg>
          }
          @case ('text') {
            <svg viewBox="0 0 24 24">
              <path
                d="M6 4h8l4 4v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
              />
              <path
                d="M14 4v4h4M8 12h8M8 16h6"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
              />
            </svg>
          }
        }
      </span>
    }

    @if (selectedFileName) {
      <span class="primary">Arquivo selecionado</span>
      <span class="secondary">{{ selectedFileName }}</span>
    } @else {
      @if (compact) {
        <span class="secondary">{{ compactPlaceholder }}</span>
      } @else {
        <span class="primary">Clique para selecionar arquivo</span>
        <span class="secondary">{{ helperLabel }}</span>
      }
    }
  </button>

  <input #fileInput type="file" [accept]="accept" (change)="onInputChange($event)" hidden />
</section>
