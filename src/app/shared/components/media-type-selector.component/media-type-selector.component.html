<section class="media-type-selector">
  <h3>Tipo de Mídia</h3>

  <div class="media-type-grid">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="media-type-item"
        [class.is-active]="selectedType === option.value"
        (click)="select(option.value)"
      >
        <span class="icon" aria-hidden="true">
          @switch (option.value) {
            @case ('video') {
              <svg viewBox="0 0 24 24">
                <path
                  d="M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1.2L20 7v10l-5-2.2V16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                />
              </svg>
            }
            @case ('audio') {
              <svg viewBox="0 0 24 24">
                <path
                  d="M9 18V6l10-2v12M9 10l10-2M6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm10 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                />
              </svg>
            }
            @case ('image') {
              <svg viewBox="0 0 24 24">
                <path
                  d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-13Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                />
                <path
                  d="m7 16 3-3 2.4 2.4L15.5 12 18 14.5M8.5 9.5h.01"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                />
              </svg>
            }
            @case ('text') {
              <svg viewBox="0 0 24 24">
                <path
                  d="M6 4h8l4 4v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                />
                <path
                  d="M14 4v4h4M8 12h8M8 16h6"
                  fill="none"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.8"
                />
              </svg>
            }
          }
        </span>
        <span class="label">{{ option.label }}</span>
      </button>
    }
  </div>
</section>
