<article class="media-card" (click)="onCardClick()" [class.media-card--clickable]="!editMode">
  <section class="media-card__cover">
    @if (coverUrl) {
      <img [src]="coverUrl" [alt]="item.title" (error)="onImageError()" />
    } @else {
      <div class="media-card__cover-placeholder" [style.background-color]="placeholderColor"></div>
    }
    <span class="media-card__type">{{ item.media_type | titlecase }}</span>
  </section>

  <section class="media-card__body">
    <h3>{{ item.title }}</h3>
    <p>{{ item.description }}</p>

    @if (editMode) {
      <footer class="media-card__actions">
        <button type="button" class="icon-button icon-button--edit" (click)="onViewClick($event)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 20h4l10.6-10.6a1.4 1.4 0 0 0 0-2L16.6 5.4a1.4 1.4 0 0 0-2 0L4 16v4Zm0 0 4-4"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            />
          </svg>
        </button>
        <button type="button" class="icon-button icon-button--danger" (click)="onDeleteClick($event)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V7M10 11v6m4-6v6"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
            />
          </svg>
        </button>
      </footer>
    }
  </section>
</article>

@if (isPlaceholderModalOpen) {
  <section class="modal-backdrop" (click)="onBackdropClick($event)">
    <article class="modal-content">
      <h4>Visualizacao da midia</h4>
      <p>Placeholder: o visualizador completo sera implementado no proximo passo.</p>
      <button type="button" (click)="closePlaceholderModal()">Fechar</button>
    </article>
  </section>
}
